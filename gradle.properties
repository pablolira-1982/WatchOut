android.useAndroidX=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=35

# Keep release builds from starving the IDE and the rest of the desktop.
# R8/Lint can be memory intensive for LiteRT-LM, so use one worker with a
# bounded heap instead of several competing Gradle processes.
org.gradle.jvmargs=-Xms256m -Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
